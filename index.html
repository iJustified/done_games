<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список пройденных игр</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            try {
                if (localStorage.getItem('theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="header__title">2026</h1>
            <div class="header__actions">
                <div class="header__counter" id="gamesCounter"></div>
            </div>
        </header>
        
        <main class="main">
            <div class="games-grid" id="gamesGrid">
                <!-- Карточки игр будут добавлены через JavaScript -->
            </div>
        </main>
    </div>

    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Включить тёмную тему" aria-pressed="false">
        <svg class="theme-toggle__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd"/>
        </svg>
    </button>
    
    <script src="script.js"></script>
</body>
</html>
